#
# Design-intent tests for <cmath> in C++ mode.
#
# <cmath> is the C++ standard wrapper.  It must provide all math functions
# in namespace std::.  For GCC on illumos, <cmath> does #include_next <math.h>
# and then provides float/long double overloads itself.
#
# IL-15209 regression: log(1) must compile without ambiguity.  Before F-1,
# math.h's using-declarations brought float and long double overloads of log
# into ::, making log(int) ambiguous.  After F-1 only log(double) is in ::.
#

#
# C90 double functions - must be in std::
#
func | std::log		| double | double		| cmath | CXX11+
func | std::log10	| double | double		| cmath | CXX11+
func | std::exp		| double | double		| cmath | CXX11+
func | std::sqrt	| double | double		| cmath | CXX11+
func | std::fabs	| double | double		| cmath | CXX11+
func | std::sin		| double | double		| cmath | CXX11+
func | std::cos		| double | double		| cmath | CXX11+
func | std::tan		| double | double		| cmath | CXX11+
func | std::pow		| double | double; double	| cmath | CXX11+
func | std::abs		| double | double		| cmath | CXX11+

#
# C90 float overloads - must be in std:: (provided by <cmath>)
#
func | std::logf	| float  | float		| cmath | CXX11+
func | std::sinf	| float  | float		| cmath | CXX11+
func | std::cosf	| float  | float		| cmath | CXX11+
func | std::sqrtf	| float  | float		| cmath | CXX11+

#
# C90 long double overloads - must be in std::
#
func | std::logl	| long double | long double	| cmath | CXX11+
func | std::sinl	| long double | long double	| cmath | CXX11+

#
# C90 float functions - must be in std::
#
func | std::log		| float       | float		| cmath | CXX11+
func | std::log10	| float       | float		| cmath | CXX11+
func | std::exp		| float       | float		| cmath | CXX11+
func | std::sqrt	| float       | float		| cmath | CXX11+
func | std::sin		| float       | float		| cmath | CXX11+
func | std::cos		| float       | float		| cmath | CXX11+

#
# C90 long double functions - must be in std::
#
func | std::log		| long double | long double	| cmath | CXX11+
func | std::log10	| long double | long double	| cmath | CXX11+
func | std::exp		| long double | long double	| cmath | CXX11+
func | std::sqrt	| long double | long double	| cmath | CXX11+
func | std::sin		| long double | long double	| cmath | CXX11+
func | std::cos		| long double | long double	| cmath | CXX11+

#
# C99 functions - must be in std:: via <cmath>
#
func | std::log2	| double | double		| cmath | CXX11+
func | std::exp2	| double | double		| cmath | CXX11+
func | std::acosh	| double | double		| cmath | CXX11+
func | std::round	| double | double		| cmath | CXX11+
func | std::trunc	| double | double		| cmath | CXX11+
func | std::hypot	| double | double; double	| cmath | CXX11+
func | std::fma		| double | double; double; double | cmath | CXX11+

#
# IL-15209 regression: log(int) must not be ambiguous.
# Before F-1, math.h pulled logf/logl into :: via using-declarations,
# making log(int) ambiguous between float and double overloads.
# Integer arguments must resolve to the double overload unambiguously.
# Also a collection of real-world cases we've tripped over.
#
func | log	| double | int			| cmath | CXX11+
func | log	| double | long int		| cmath | CXX11+
func | log	| double | unsigned long	| cmath | CXX11+
func | log10	| double | int			| cmath | CXX11+
func | fabs	| double | int			| cmath | CXX11+
func | floor	| double | int			| cmath | CXX11+
func | sqrt	| double | int			| cmath | CXX11+
func | sqrt	| double | long int		| cmath | CXX11+
func | sqrt	| double | unsigned int		| cmath | CXX11+
func | sqrt	| double | unsigned long	| cmath | CXX11+
func | pow	| double | int; int		| cmath | CXX11+
func | pow	| double | double; long double	| cmath | CXX11+
func | atan2	| double | int; int		| cmath | CXX11+
