#
# Design-intent tests for <ctime> in C++ mode.
#
# <ctime> is the C++ standard wrapper.  It must provide all C90 time
# functions in namespace std::.  time_iso.h declares all functions in
# namespace std::; there are no C99 additions to time.h on illumos.
#

#
# C90 functions — must be in std::
#
func | std::clock	| clock_t	| 					| ctime | CXX11+
func | std::time	| time_t	| time_t *				| ctime | CXX11+
func | std::mktime	| time_t	| struct tm *				| ctime | CXX11+
func | std::difftime	| double	| time_t; time_t			| ctime | CXX11+
func | std::asctime	| char *	| const struct tm *			| ctime | CXX11+
func | std::ctime	| char *	| const time_t *			| ctime | CXX11+
func | std::gmtime	| struct tm *	| const time_t *			| ctime | CXX11+
func | std::localtime	| struct tm *	| const time_t *			| ctime | CXX11+
func | std::strftime	| size_t	| char *; size_t; const char *; const struct tm * | ctime | CXX11+
