#
# Design-intent tests for <iso/math_iso.h> in C++ mode.
#
# iso/math_iso.h is the first layer of the std-primary namespace pattern.
# It wraps all C90 math declarations in:
#
#   #if __cplusplus >= 199711L
#   namespace std {
#   #endif
#       extern double log(double);
#       ...
#   #if __cplusplus >= 199711L
#   }
#   #endif
#
# Functions land in std:: but NOT in ::.  The using-declarations that
# alias them to :: live in <math.h>, not here.
#
# Positive entries (CXX11+): std::X must compile.
# Negative entries (-CXX11+): unqualified X must NOT compile.
#

#
# std:: placement — must succeed
#
func | std::acos	| double | double		| iso/math_iso.h | CXX11+
func | std::asin	| double | double		| iso/math_iso.h | CXX11+
func | std::atan	| double | double		| iso/math_iso.h | CXX11+
func | std::atan2	| double | double; double	| iso/math_iso.h | CXX11+
func | std::ceil	| double | double		| iso/math_iso.h | CXX11+
func | std::cos		| double | double		| iso/math_iso.h | CXX11+
func | std::cosh	| double | double		| iso/math_iso.h | CXX11+
func | std::exp		| double | double		| iso/math_iso.h | CXX11+
func | std::fabs	| double | double		| iso/math_iso.h | CXX11+
func | std::floor	| double | double		| iso/math_iso.h | CXX11+
func | std::fmod	| double | double; double	| iso/math_iso.h | CXX11+
func | std::frexp	| double | double; int *	| iso/math_iso.h | CXX11+
func | std::ldexp	| double | double; int		| iso/math_iso.h | CXX11+
func | std::log		| double | double		| iso/math_iso.h | CXX11+
func | std::log10	| double | double		| iso/math_iso.h | CXX11+
func | std::modf	| double | double; double *	| iso/math_iso.h | CXX11+
func | std::pow		| double | double; double	| iso/math_iso.h | CXX11+
func | std::sin		| double | double		| iso/math_iso.h | CXX11+
func | std::sinh	| double | double		| iso/math_iso.h | CXX11+
func | std::sqrt	| double | double		| iso/math_iso.h | CXX11+
func | std::tan		| double | double		| iso/math_iso.h | CXX11+
func | std::tanh	| double | double		| iso/math_iso.h | CXX11+
func | std::abs		| double | double		| iso/math_iso.h | CXX11+

#
# :: NOT populated yet — must fail to compile
#
func | log	| double | double		| iso/math_iso.h | -CXX11+
func | fabs	| double | double		| iso/math_iso.h | -CXX11+
func | sqrt	| double | double		| iso/math_iso.h | -CXX11+
func | sin	| double | double		| iso/math_iso.h | -CXX11+
func | cos	| double | double		| iso/math_iso.h | -CXX11+
func | pow	| double | double; double	| iso/math_iso.h | -CXX11+
func | abs	| double | double		| iso/math_iso.h | -CXX11+
