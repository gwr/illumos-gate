#
# Design-intent tests for <iso/math_c99.h> in C++ mode (F-3 applied).
#
# Like iso/math_iso.h for C90 functions, iso/math_c99.h (with F-3) wraps
# the C99 declarations in namespace std {}.  Functions land in std:: but
# NOT in ::.  The using-declarations live in <math.h>.
#
# Positive entries (CXX_C99+): std::X must compile.
# Negative entries (-CXX_C99+): unqualified X must NOT compile.
#

#
# std:: placement — must succeed
#
func | std::acosh	| double | double		| iso/math_c99.h | CXX_C99+
func | std::acoshf	| float  | float		| iso/math_c99.h | CXX_C99+
func | std::acoshl	| long double | long double	| iso/math_c99.h | CXX_C99+
func | std::asinh	| double | double		| iso/math_c99.h | CXX_C99+
func | std::asinhf	| float  | float		| iso/math_c99.h | CXX_C99+
func | std::atanh	| double | double		| iso/math_c99.h | CXX_C99+
func | std::cbrt	| double | double		| iso/math_c99.h | CXX_C99+
func | std::cbrtf	| float  | float		| iso/math_c99.h | CXX_C99+
func | std::cbrtl	| long double | long double	| iso/math_c99.h | CXX_C99+
func | std::exp2	| double | double		| iso/math_c99.h | CXX_C99+
func | std::exp2f	| float  | float		| iso/math_c99.h | CXX_C99+
func | std::exp2l	| long double | long double	| iso/math_c99.h | CXX_C99+
func | std::expm1	| double | double		| iso/math_c99.h | CXX_C99+
func | std::hypot	| double | double; double	| iso/math_c99.h | CXX_C99+
func | std::hypotf	| float  | float; float		| iso/math_c99.h | CXX_C99+
func | std::log1p	| double | double		| iso/math_c99.h | CXX_C99+
func | std::log2	| double | double		| iso/math_c99.h | CXX_C99+
func | std::log2f	| float  | float		| iso/math_c99.h | CXX_C99+
func | std::log2l	| long double | long double	| iso/math_c99.h | CXX_C99+
func | std::nearbyint	| double | double		| iso/math_c99.h | CXX_C99+
func | std::remainder	| double | double; double	| iso/math_c99.h | CXX_C99+
func | std::rint	| double | double		| iso/math_c99.h | CXX_C99+
func | std::round	| double | double		| iso/math_c99.h | CXX_C99+
func | std::roundf	| float  | float		| iso/math_c99.h | CXX_C99+
func | std::roundl	| long double | long double	| iso/math_c99.h | CXX_C99+
func | std::trunc	| double | double		| iso/math_c99.h | CXX_C99+
func | std::fma		| double | double; double; double | iso/math_c99.h | CXX_C99+
func | std::fmax	| double | double; double	| iso/math_c99.h | CXX_C99+
func | std::fmin	| double | double; double	| iso/math_c99.h | CXX_C99+
func | std::llrint	| long long | double		| iso/math_c99.h | CXX_C99+
func | std::llrintf	| long long | float		| iso/math_c99.h | CXX_C99+
func | std::llround	| long long | double		| iso/math_c99.h | CXX_C99+

#
# :: NOT populated yet — must fail to compile
#
func | acosh	| double | double		| iso/math_c99.h | -CXX_C99+
func | exp2	| double | double		| iso/math_c99.h | -CXX_C99+
func | hypot	| double | double; double	| iso/math_c99.h | -CXX_C99+
func | log2	| double | double		| iso/math_c99.h | -CXX_C99+
func | round	| double | double		| iso/math_c99.h | -CXX_C99+
func | acoshf	| float  | float		| iso/math_c99.h | -CXX_C99+
func | llround	| long long | double		| iso/math_c99.h | -CXX_C99+
