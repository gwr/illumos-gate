#
# Compilation environments for C++ symbol visibility tests.
#
# Each environment specifies a C++ standard and optional preprocessor
# definitions.  The CXX_C99+ group adds -D_STDC_C99 to unlock C99
# math declarations that are gated by feature-test macros.
#

env | CXX11		| c++11 |
env | CXX14		| c++14 |
env | CXX17		| c++17 |

env | CXX11_C99		| c++11 | -D_STDC_C99
env | CXX14_C99		| c++14 | -D_STDC_C99
env | CXX17_C99		| c++17 | -D_STDC_C99

env_group | CXX11+	| CXX17 CXX14 CXX11
env_group | CXX_C99+	| CXX17_C99 CXX14_C99 CXX11_C99
