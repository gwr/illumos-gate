#
# Design notes for <cstdlib> test cases
#
# <cstdlib> must provide all C90 stdlib functions in namespace std::
# For GCC on illumos, <cstdlib> does #include_next <stdlib.h> and then
# adds using-declarations.
#
# stdlib_iso.h declares C90 functions in namespace std::.
# stdlib_c99.h does NOT wrap in namespace std:: (unlike math_c99.h after
# 15209), so C99 symbols only reach std:: via GCC's using-declarations
# in <cstdlib>.  stdlib_c11.h DOES wrap in namespace std::.
#

#
# C90 functions - must be in std::
#
func | std::abs	| int		| int			| cstdlib | CXX11+
func | std::atof	| double	| const char *		| cstdlib | CXX11+
func | std::atoi	| int		| const char *		| cstdlib | CXX11+
func | std::atol	| long		| const char *		| cstdlib | CXX11+
func | std::calloc	| void *	| size_t; size_t	| cstdlib | CXX11+
func | std::div	| div_t		| int; int		| cstdlib | CXX11+
func | std::free	| void		| void *		| cstdlib | CXX11+
func | std::getenv	| char *	| const char *		| cstdlib | CXX11+
func | std::labs	| long		| long			| cstdlib | CXX11+
func | std::ldiv	| ldiv_t	| long; long		| cstdlib | CXX11+
func | std::malloc	| void *	| size_t		| cstdlib | CXX11+
func | std::rand	| int		|			| cstdlib | CXX11+
func | std::realloc	| void *	| void *; size_t	| cstdlib | CXX11+
func | std::srand	| void		| unsigned int		| cstdlib | CXX11+
func | std::strtod	| double	| const char *; char **	| cstdlib | CXX11+
func | std::strtol	| long		| const char *; char **; int | cstdlib | CXX11+
func | std::strtoul	| unsigned long	| const char *; char **; int | cstdlib | CXX11+

#
# C++ overloads for abs and div with long - must be in std::
#
func | std::abs	| long		| long			| cstdlib | CXX11+
func | std::div	| ldiv_t	| long; long		| cstdlib | CXX11+

#
# Unqualified abs - C++11 [c.math] requires floating-point overloads
# from <cstdlib>; abs(double) must not be ambiguous (x265 regression).
#
func | abs	| int		| int			| cstdlib | CXX11+
func | abs	| long		| long			| cstdlib | CXX11+
func | abs	| double	| double		| cstdlib | CXX11+

#
# C99 functions - must be in std:: via <cstdlib>
#
func | std::llabs	| long long	| long long		| cstdlib | CXX_C99+
func | std::strtof	| float		| const char *; char **	| cstdlib | CXX_C99+
func | std::strtold	| long double	| const char *; char **	| cstdlib | CXX_C99+
func | std::strtoll	| long long	| const char *; char **; int | cstdlib | CXX_C99+
func | std::strtoull	| unsigned long long | const char *; char **; int | cstdlib | CXX_C99+
func | std::atoll	| long long	| const char *		| cstdlib | CXX_C99+

#
# C11 functions - must be in std:: (stdlib_c11.h wraps in namespace std::)
#
func | std::at_quick_exit | int	| void (*)(void)	| cstdlib | CXX11+
func | std::aligned_alloc | void * | size_t; size_t	| cstdlib | CXX11+
