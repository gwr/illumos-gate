#
# Design notes for <cwchar> test cases
#
# <cwchar> must provide all C90/C99 wchar functions in namespace std::
# wchar_iso.h declares functions in namespace std::; wchar_c99.h
# does NOT wrap in namespace std:: (todo: 18190), so # C99 symbols only
# reach std:: via GCC's using-declarations in <cwchar>.
#

#
# Wide string functions - must be in std::
#
func | std::wcscat	| wchar_t *	| wchar_t *; const wchar_t *		| cwchar | CXX98+
func | std::wcschr	| const wchar_t * | const wchar_t *; wchar_t		| cwchar | CXX98+
func | std::wcscmp	| int		| const wchar_t *; const wchar_t *	| cwchar | CXX98+
func | std::wcscoll	| int		| const wchar_t *; const wchar_t *	| cwchar | CXX98+
func | std::wcscpy	| wchar_t *	| wchar_t *; const wchar_t *		| cwchar | CXX98+
func | std::wcscspn	| size_t	| const wchar_t *; const wchar_t *	| cwchar | CXX98+
func | std::wcslen	| size_t	| const wchar_t *			| cwchar | CXX98+
func | std::wcsncat	| wchar_t *	| wchar_t *; const wchar_t *; size_t	| cwchar | CXX98+
func | std::wcsncmp	| int		| const wchar_t *; const wchar_t *; size_t | cwchar | CXX98+
func | std::wcsncpy	| wchar_t *	| wchar_t *; const wchar_t *; size_t	| cwchar | CXX98+
func | std::wcspbrk	| const wchar_t * | const wchar_t *; const wchar_t *	| cwchar | CXX98+
func | std::wcsrchr	| const wchar_t * | const wchar_t *; wchar_t		| cwchar | CXX98+
func | std::wcsspn	| size_t	| const wchar_t *; const wchar_t *	| cwchar | CXX98+
func | std::wcsstr	| const wchar_t * | const wchar_t *; const wchar_t *	| cwchar | CXX98+
func | std::wcsxfrm	| size_t	| wchar_t *; const wchar_t *; size_t	| cwchar | CXX98+
func | std::wcstod	| double	| const wchar_t *; wchar_t **		| cwchar | CXX98+
func | std::wcstol	| long		| const wchar_t *; wchar_t **; int	| cwchar | CXX98+
func | std::wcstoul	| unsigned long	| const wchar_t *; wchar_t **; int	| cwchar | CXX98+

#
# Wide memory functions - must be in std::
#
func | std::wmemchr	| const wchar_t * | const wchar_t *; wchar_t; size_t	| cwchar | CXX98+
func | std::wmemcmp	| int		| const wchar_t *; const wchar_t *; size_t | cwchar | CXX98+
func | std::wmemcpy	| wchar_t *	| wchar_t *; const wchar_t *; size_t	| cwchar | CXX98+
func | std::wmemmove	| wchar_t *	| wchar_t *; const wchar_t *; size_t	| cwchar | CXX98+
func | std::wmemset	| wchar_t *	| wchar_t *; wchar_t; size_t		| cwchar | CXX98+

#
# Wide character I/O - must be in std::
#
func | std::fgetwc	| wint_t	| FILE *				| cwchar | CXX98+
func | std::fputwc	| wint_t	| wint_t; FILE *			| cwchar | CXX98+
func | std::getwc	| wint_t	| FILE *				| cwchar | CXX98+
func | std::getwchar	| wint_t	|					| cwchar | CXX98+
func | std::putwc	| wint_t	| wint_t; FILE *			| cwchar | CXX98+
func | std::putwchar	| wint_t	| wint_t				| cwchar | CXX98+
func | std::ungetwc	| wint_t	| wint_t; FILE *			| cwchar | CXX98+
func | std::btowc	| wint_t	| int					| cwchar | CXX98+
func | std::wctob	| int		| wint_t				| cwchar | CXX98+

#
# Multibyte/wide conversion - must be in std::
#
func | std::mbsinit	| int		| const mbstate_t *			| cwchar | CXX98+
func | std::mbrlen	| size_t	| const char *; size_t; mbstate_t *	| cwchar | CXX98+
func | std::mbrtowc	| size_t	| wchar_t *; const char *; size_t; mbstate_t * | cwchar | CXX98+
func | std::wcrtomb	| size_t	| char *; wchar_t; mbstate_t *		| cwchar | CXX98+
func | std::mbsrtowcs	| size_t	| wchar_t *; const char **; size_t; mbstate_t * | cwchar | CXX98+
func | std::wcsrtombs	| size_t	| char *; const wchar_t **; size_t; mbstate_t * | cwchar | CXX98+

#
# C99 functions - must be in std:: via <cwchar>
# (wchar_c99.h lacks namespace std:: wrapper; GCC's <cwchar> bridges the gap)
#
func | std::wcstof	| float		| const wchar_t *; wchar_t **		| cwchar | CXX_C99+
func | std::wcstold	| long double	| const wchar_t *; wchar_t **		| cwchar | CXX_C99+
func | std::wcstoll	| long long	| const wchar_t *; wchar_t **; int	| cwchar | CXX_C99+
func | std::wcstoull	| unsigned long long | const wchar_t *; wchar_t **; int	| cwchar | CXX_C99+
func | std::vfwscanf	| int		| FILE *; const wchar_t *; std::va_list	| cwchar; cwctype; cstdarg | CXX_C99+
func | std::vswscanf	| int		| const wchar_t *; const wchar_t *; std::va_list | cwchar; cwctype; cstdarg | CXX_C99+
func | std::vwscanf	| int		| const wchar_t *; std::va_list		| cwchar; cwctype; cstdarg | CXX_C99+
