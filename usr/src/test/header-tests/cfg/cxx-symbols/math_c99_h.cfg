#
# Design notes for <iso/math_c99.h> test cases
#
# C++11 requires C99 math functions to be available in both std:: and
# the global :: namespace.  When testing via the C header directly,
# -D_STDC_C99 is needed to enable the C99 declarations.
#
# Positive entries (CXX_C99+): both std::X and unqualified X must compile.
#

#
# std:: placement - must succeed
#
func | std::acosh			|\
	double				|\
	double				|\
	iso/math_c99.h | CXX_C99+
func | std::acoshf			|\
	float				|\
	float				|\
	iso/math_c99.h | CXX_C99+
func | std::acoshl			|\
	long double			|\
	long double			|\
	iso/math_c99.h | CXX_C99+
