#
# Design notes for <math.h> test cases
#
# <math.h> includes iso/math_iso.h and iso/math_c99.h which declare the
# C90/C99 math functions in the global :: namespace using the global-primary
# pattern (see 15209).  math.h adds macros and the _XOPEN_SOURCE extensions
#
# C90 functions (CXX98+): both std::X and unqualified X must succeed.
# C99 functions (CXX_C99+): both std::X and unqualified X must succeed.
#

#
# C90: std:: qualification
#
func | std::log		| double | double		| math.h | CXX98+
func | std::log10	| double | double		| math.h | CXX98+
func | std::exp		| double | double		| math.h | CXX98+
func | std::pow		| double | double; double	| math.h | CXX98+
func | std::sqrt	| double | double		| math.h | CXX98+
func | std::fabs	| double | double		| math.h | CXX98+
func | std::sin		| double | double		| math.h | CXX98+
func | std::cos		| double | double		| math.h | CXX98+
func | std::tan		| double | double		| math.h | CXX98+
func | std::ceil	| double | double		| math.h | CXX98+
func | std::floor	| double | double		| math.h | CXX98+
func | std::abs		| double | double		| math.h | CXX98+

#
# C90: unqualified (::) - must also succeed
#
func | log	| double | double		| math.h | CXX98+
#
# Regression test for 15209: log(int) must not be ambiguous via <math.h>.
# Before 15209, iso/math_iso.h's using-declarations brought logf/logl
# into ::, making log(int) ambiguous between float and double overloads.
# Integer arguments must resolve to the double overload unambiguously.
#
func | log	| double | int			| math.h | CXX98+
func | fabs	| double | int			| math.h | CXX98+
func | floor	| double | int			| math.h | CXX98+
func | sqrt	| double | int			| math.h | CXX98+
func | sqrt	| double | long int		| math.h | CXX98+
func | pow	| double | int; int		| math.h | CXX98+
func | log10	| double | double		| math.h | CXX98+
func | exp	| double | double		| math.h | CXX98+
func | pow	| double | double; double	| math.h | CXX98+
func | sqrt	| double | double		| math.h | CXX98+
func | fabs	| double | double		| math.h | CXX98+
func | sin	| double | double		| math.h | CXX98+
func | cos	| double | double		| math.h | CXX98+
func | tan	| double | double		| math.h | CXX98+
func | ceil	| double | double		| math.h | CXX98+
func | floor	| double | double		| math.h | CXX98+
func | abs	| double | double		| math.h | CXX98+

#
# C99: std:: qualification
#
func | std::acosh	| double | double		| math.h | CXX_C99+
func | std::acoshf	| float  | float		| math.h | CXX_C99+
func | std::acoshl	| long double | long double	| math.h | CXX_C99+
func | std::asinh	| double | double		| math.h | CXX_C99+
func | std::atanh	| double | double		| math.h | CXX_C99+
func | std::cbrt	| double | double		| math.h | CXX_C99+
func | std::cbrtf	| float  | float		| math.h | CXX_C99+
func | std::exp2	| double | double		| math.h | CXX_C99+
func | std::exp2f	| float  | float		| math.h | CXX_C99+
func | std::exp2l	| long double | long double	| math.h | CXX_C99+
func | std::expm1	| double | double		| math.h | CXX_C99+
func | std::hypot	| double | double; double	| math.h | CXX_C99+
func | std::hypotf	| float  | float; float		| math.h | CXX_C99+
func | std::log1p	| double | double		| math.h | CXX_C99+
func | std::log2	| double | double		| math.h | CXX_C99+
func | std::log2f	| float  | float		| math.h | CXX_C99+
func | std::log2l	| long double | long double	| math.h | CXX_C99+
func | std::nearbyint	| double | double		| math.h | CXX_C99+
func | std::remainder	| double | double; double	| math.h | CXX_C99+
func | std::round	| double | double		| math.h | CXX_C99+
func | std::roundf	| float  | float		| math.h | CXX_C99+
func | std::roundl	| long double | long double	| math.h | CXX_C99+
func | std::trunc	| double | double		| math.h | CXX_C99+
func | std::fma		| double | double; double; double | math.h | CXX_C99+
func | std::fmax	| double | double; double	| math.h | CXX_C99+
func | std::fmin	| double | double; double	| math.h | CXX_C99+
func | std::llrint	| long long | double		| math.h | CXX_C99+
func | std::llrintf	| long long | float		| math.h | CXX_C99+
func | std::llround	| long long | double		| math.h | CXX_C99+

