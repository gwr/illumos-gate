#
# Definitions found in ucontext.h
#

# See the notes in head/ucontext.h about exposure in XPG4v2 and POSIX.
# In order for these tests to pass for POSIX cases (as explained in
# those header comments) we need to specify tests below that allow
# <ucontext.h> types to appear in "ALL" (not just -POSIX+ SUS+)
#
# The macro values REG_* etc _are_ hidden in SUS+ environments,
# so those use the environment: ALL -SUS+

#
# Types.
#
type |	sigset_t	| ucontext.h | ALL
type |	stack_t		| ucontext.h | ALL
type |	mcontext_t	| ucontext.h | ALL
type |	ucontext_t	| ucontext.h | ALL

#
# Values.
#
# REG_SP is exposed because <ucontext.h> includes <sys/regset.h>
# for compatibility.  Revisit this if that changes.
value |	REG_SP		| int	| ucontext.h | ALL -SUS+
value |	GETCONTEXT	| int	| ucontext.h | ALL -SUS+

#
# Register names that should NOT be defined.
#
define | CS		|	| ucontext.h | -ALL
define | DS		|	| ucontext.h | -ALL
define | ES		|	| ucontext.h | -ALL
define | FS		|	| ucontext.h | -ALL
define | GS		|	| ucontext.h | -ALL
define | SS		|	| ucontext.h | -ALL
define | EAX		|	| ucontext.h | -ALL
define | EBX		|	| ucontext.h | -ALL
define | ECX		|	| ucontext.h | -ALL
define | EDX		|	| ucontext.h | -ALL
define | EBP		|	| ucontext.h | -ALL
define | ESP		|	| ucontext.h | -ALL
define | ESI		|	| ucontext.h | -ALL
define | EDI		|	| ucontext.h | -ALL
define | EIP		|	| ucontext.h | -ALL
define | EFL		|	| ucontext.h | -ALL
define | ERR		|	| ucontext.h | -ALL
define | TRAPNO		|	| ucontext.h | -ALL
define | UESP		|	| ucontext.h | -ALL

#
# Functions
#
