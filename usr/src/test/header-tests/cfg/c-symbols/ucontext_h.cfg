#
# Definitions found in ucontext.h
#

# <ucontext.h> was introduced by XPG4v2/UNIX95 (~1995); it is not
# defined by C90/C99/C11/C17, nor by any POSIX revision up through
# POSIX-1995, nor by POSIX-2001 or later on its own (it was marked
# obsolescent there, and removed in POSIX-2008).  None of these
# standards say anything about sigset_t, stack_t, mcontext_t, or
# ucontext_t being visible via <ucontext.h> here.
#
# As a practical matter, ucontext.h always declares ucontext_t
# and it doesn't make sense to do that conditionally. Let's
# say including ucontext.h in older POSIX code gives "undefined"
# behavior, and maintain the historical practice here.
#
# Given that the types are not actually "hidden" from posix,
# the type checks need environment: ALL
#
# The macro values REG_* etc _are_ hidden from posix, so
# those use the environment: ALL -SUS+

# Test a built-in type to ensure the header compiles in ALL envs.
type | int | ucontext.h | ALL

#
# Types.
#
type |	sigset_t	| ucontext.h | ALL
type |	stack_t		| ucontext.h | ALL
type |	mcontext_t	| ucontext.h | ALL
type |	ucontext_t	| ucontext.h | ALL

#
# Values.
#
value |	REG_SP		| int	| ucontext.h | ALL -SUS+
value |	GETCONTEXT	| int	| ucontext.h | ALL -SUS+

#
# Functions
#
