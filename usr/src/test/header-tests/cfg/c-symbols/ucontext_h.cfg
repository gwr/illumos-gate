#
# Definitions found in ucontext.h
#

#
# Types.
#
# <ucontext.h> was introduced by XPG4v2/UNIX95 (~1995); it is not
# defined by C90/C99/C11/C17, nor by any POSIX revision up through
# POSIX-1995, nor by POSIX-2001 or later on its own (it was marked
# obsolescent there, and removed in POSIX-2008).  None of these
# standards say anything about sigset_t, stack_t, mcontext_t, or
# ucontext_t being visible via <ucontext.h> here -- illumos exposes
# them under STDC and POSIX-1990 .. POSIX-1995, as a longstanding
# implementation choice, matching what it already exposes under
# XPG4v2/SUS.  That effectively means "ALL"
#
type |	sigset_t	| ucontext.h | ALL
type |	stack_t		| ucontext.h | ALL
type |	mcontext_t	| ucontext.h | ALL
type |	ucontext_t	| ucontext.h | ALL

#
# Values.
#
value |	REG_SP		| int	| ucontext.h | -POSIX+ -SUS+
value |	GETCONTEXT	| int	| ucontext.h | -POSIX+ -SUS+

