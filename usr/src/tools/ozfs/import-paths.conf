# Import path policy (INI).  See ozfs-import(1onbld).
# Mapping entries are OpenZFS path = illumos path.  Indented continuation
# lines supply alternative destinations for a source prefix.
# Exclude/review sections contain paths without values; :(glob) is allowed.
# Longest prefixes win; ambiguous destinations require review unless exactly
# one destination already exists.  Only [additions] permits new paths.
# Platform sections explicitly select primary or alternate OS interfaces.
# Case is significant.  Comments occupy their own lines; no inline comments.

# Map OpenZFS files and directory prefixes to existing illumos counterparts.
[map]
module/lua = usr/src/uts/common/fs/zfs/lua
module/zcommon = usr/src/common/zfs
include/sys/abd_impl.h = usr/src/uts/common/fs/zfs/sys/abd_impl.h
include/sys = usr/src/common/zfs
	usr/src/uts/common/fs/zfs/sys
# ZFS-private headers use fs/zfs/sys above.  Native OS interfaces use
# uts/common/sys through explicit per-file mappings below.
include/sys/fs/zfs.h = usr/src/uts/common/sys/fs/zfs.h
include/sys/fs/zut.h = usr/src/uts/common/sys/fs/zut.h
include/sys/fm/fs/zfs.h = usr/src/uts/common/sys/fm/fs/zfs.h
module/zfs = usr/src/uts/common/fs/zfs
module/nvpair = usr/src/common/nvpair
module/unicode = usr/src/common/unicode
module/avl = usr/src/common/avl
include/sys/nvpair.h = usr/src/uts/common/sys/nvpair.h
include/sys/nvpair_impl.h = usr/src/uts/common/sys/nvpair_impl.h
include/sys/u8_textprep.h = usr/src/uts/common/sys/u8_textprep.h
include/sys/u8_textprep_data.h = usr/src/uts/common/sys/u8_textprep_data.h
include/sys/avl.h = usr/src/uts/common/sys/avl.h
include/sys/avl_impl.h = usr/src/uts/common/sys/avl_impl.h
include/libzfs.h = usr/src/lib/libzfs/common/libzfs.h
include/libzfs_impl.h = usr/src/lib/libzfs/common/libzfs_impl.h
lib/libzfs = usr/src/lib/libzfs/common
lib/libzfs_core = usr/src/lib/libzfs_core
lib/libzpool = usr/src/lib/libzpool
lib/libzutil = usr/src/lib/libzutil/common
cmd/zpool = usr/src/cmd/zpool
cmd/zfs = usr/src/cmd/zfs
cmd/zdb = usr/src/cmd/zdb
cmd/zhack = usr/src/cmd/zhack
cmd/zhack.c = usr/src/cmd/zhack/zhack.c
cmd/zinject = usr/src/cmd/zinject
cmd/raidz_test = usr/src/cmd/raidz_test
cmd/zstreamdump = usr/src/cmd/zstreamdump
cmd/ztest = usr/src/cmd/ztest
cmd/ztest.c = usr/src/cmd/ztest/ztest.c
lib/libefi = usr/src/lib/libefi/common
lib/libnvpair = usr/src/lib/libnvpair
lib/libuutil = usr/src/lib/libuutil/common
lib/libzfsbootenv = usr/src/lib/libzfsbootenv/common
include/libnvpair.h = usr/src/lib/libnvpair/libnvpair.h
include/libuutil.h = usr/src/lib/libuutil/common/libuutil.h
include/libuutil_common.h = usr/src/lib/libuutil/common/libuutil_common.h
include/libuutil_impl.h = usr/src/lib/libuutil/common/libuutil_impl.h
include/libzfsbootenv.h = usr/src/lib/libzfsbootenv/common/libzfsbootenv.h
tests/runfiles/common.run = usr/src/test/zfs-tests/runfiles/common.run
tests/zfs-tests = usr/src/test/zfs-tests

# Map OpenZFS paths that are also permitted to create new illumos files.
[additions]
tests/zfs-tests = usr/src/test/zfs-tests

# Reject mappings into these illumos files or directory subtrees.
[exclude-illumos]
usr/src/cmd/mdb/common/modules/zfs
usr/src/uts/common/fs/vnode.c
usr/src/tools/quick/make-zfs
usr/src/cmd/zlook

# Omit and report changes to these OpenZFS paths or glob patterns.
[exclude-openzfs]
cmd/zed
cmd/zpios
:(glob)cmd/zpool/compatibility.d/*
include/zpios-ctl.h
include/zpios-internal.h
module/zpios
include/os/freebsd/spl
include/os/linux/spl
lib/libspl
module/os/freebsd/spl
module/os/linux/spl
include/os/linux/zfs/sys/policy.h
module/os/linux/zfs/policy.c
module/os/linux/zfs/zfs_acl.c
lib/libicp
lib/libshare
lib/libzstd
lib/libavl
lib/libzfs/libzfs.abi
lib/libzfs/os
lib/libzfs_core/libzfs_core.abi
lib/libzpool/kernel.c
tests/test-runner
tests/runfiles/bclone.run
tests/runfiles/freebsd.run
tests/runfiles/linux.run
tests/runfiles/longevity.run
tests/runfiles/perf-regression.run
tests/runfiles/sanity.run
tests/runfiles/sunos.run
scripts
module/icp
module/zstd
config
rpm
udev
etc/systemd
man
.github
configure.ac
autogen.sh
:(glob)Makefile.am
:(glob)**/Makefile.am
:(glob).gitignore
:(glob)**/.gitignore
:(glob)*.pc.in
:(glob)**/*.pc.in
:(glob)*.suppr
:(glob)**/*.suppr
lib/libnvpair/libnvpair.abi
lib/libuutil/libuutil.abi
lib/libzfsbootenv/libzfsbootenv.abi
module/nvpair/Makefile.in
module/unicode/Makefile.in
module/avl/Makefile.in

# Require review for changes mapped to these native or divergent illumos paths.
[review-illumos]
usr/src/uts/common/fs/zfs/zfs_acl.c
usr/src/uts/common/fs/zfs/zfs_vfsops.c
usr/src/uts/common/fs/zfs/zfs_vnops.c
usr/src/lib/libefi/common
usr/src/lib/libnvpair
usr/src/lib/libuutil/common
usr/src/lib/libzfsbootenv/common
usr/src/common/nvpair
usr/src/common/unicode
usr/src/common/avl
usr/src/uts/common/sys/nvpair.h
usr/src/uts/common/sys/nvpair_impl.h
usr/src/uts/common/sys/u8_textprep.h
usr/src/uts/common/sys/u8_textprep_data.h
usr/src/uts/common/sys/avl.h
usr/src/uts/common/sys/avl_impl.h

# Require review for these OpenZFS paths before any automatic mapping.
[review-openzfs]

# Use these FreeBSD implementations as the selected illumos counterparts.
[primary-freebsd]
module/os/freebsd/zfs/abd_os.c = usr/src/uts/common/fs/zfs/abd.c
module/os/freebsd/zfs/arc_os.c = usr/src/uts/common/fs/zfs/arc.c
module/os/freebsd/zfs/dmu_os.c = usr/src/uts/common/fs/zfs/dmu.c
module/os/freebsd/zfs/hkdf.c = usr/src/uts/common/fs/zfs/hkdf.c
module/os/freebsd/zfs/vdev_file.c = usr/src/uts/common/fs/zfs/vdev_file.c
module/os/freebsd/zfs/vdev_label_os.c = usr/src/uts/common/fs/zfs/vdev_label.c
module/os/freebsd/zfs/zfs_ctldir.c = usr/src/uts/common/fs/zfs/zfs_ctldir.c
