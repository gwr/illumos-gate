module/os/freebsd/zfs/zfs_ioctl_os.c = usr/src/uts/common/fs/zfs/zfs_ioctl.c
module/os/freebsd/zfs/zfs_vfsops.c = usr/src/uts/common/fs/zfs/zfs_vfsops.c
module/os/freebsd/zfs/zfs_vnops_os.c = usr/src/uts/common/fs/zfs/zfs_vnops.c
module/os/freebsd/zfs/zfs_znode_os.c = usr/src/uts/common/fs/zfs/zfs_znode.c
module/os/freebsd/zfs/zvol_os.c = usr/src/uts/common/fs/zfs/zvol.c

# Omit and report these Linux alternatives to the selected implementations.
[alternate-linux]
module/os/linux/zfs/abd_os.c = usr/src/uts/common/fs/zfs/abd.c
module/os/linux/zfs/arc_os.c = usr/src/uts/common/fs/zfs/arc.c
module/os/linux/zfs/vdev_file.c = usr/src/uts/common/fs/zfs/vdev_file.c
module/os/linux/zfs/zfs_ctldir.c = usr/src/uts/common/fs/zfs/zfs_ctldir.c
module/os/linux/zfs/zfs_debug.c = usr/src/uts/common/fs/zfs/zfs_debug.c
module/os/linux/zfs/zfs_ioctl_os.c = usr/src/uts/common/fs/zfs/zfs_ioctl.c
module/os/linux/zfs/zfs_vfsops.c = usr/src/uts/common/fs/zfs/zfs_vfsops.c
module/os/linux/zfs/zfs_vnops_os.c = usr/src/uts/common/fs/zfs/zfs_vnops.c
module/os/linux/zfs/zfs_znode_os.c = usr/src/uts/common/fs/zfs/zfs_znode.c
module/os/linux/zfs/zvol_os.c = usr/src/uts/common/fs/zfs/zvol.c

# Use these Linux implementations as the selected illumos counterparts.
[primary-linux]
module/os/linux/zfs/vdev_disk.c = usr/src/uts/common/fs/zfs/vdev_disk.c
module/os/linux/zfs/zfs_dir.c = usr/src/uts/common/fs/zfs/zfs_dir.c
module/os/linux/zfs/zio_crypt.c = usr/src/uts/common/fs/zfs/zio_crypt.c

# Omit and report these FreeBSD alternatives to the selected implementations.
[alternate-freebsd]
module/os/freebsd/zfs/zfs_dir.c = usr/src/uts/common/fs/zfs/zfs_dir.c
module/os/freebsd/zfs/zio_crypt.c = usr/src/uts/common/fs/zfs/zio_crypt.c
